name: Build Cato iOS (.ipa)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App without Mac
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version
          xcodebuild -list -project Cato.xcodeproj

      - name: Build iOS App (.app)
        run: |
          xcodebuild clean build \
            -project Cato.xcodeproj \
            -scheme Cato \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package into .ipa
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData -name "Cato.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r Cato.ipa Payload
          ls -lh Cato.ipa

      - name: Upload .ipa to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cato-iOS-IPA
          path: build/Cato.ipa
          retention-days: 14
